<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vacation Sign-Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef2f7;
      color: #1a202c;
      min-height: 100vh;
      padding-bottom: 32px;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }
    header h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
    header p  { font-size: 0.82rem; opacity: 0.85; margin-top: 3px; }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 0;
    }

    /* ── Cards ─────────────────────────────── */
    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 10px;
    }

    /* ── Inputs & Selects ───────────────────── */
    select, input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      color: #1a202c;
      background: white;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
    }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; min-width: 0; }

    /* ── Buttons ───────────────────────────── */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 13px 18px;
      min-height: 48px;
      transition: filter 0.1s, transform 0.1s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { filter: brightness(0.88); transform: scale(0.97); }

    .btn-blue   { background: #2563eb; color: white; }
    .btn-green  { background: #16a34a; color: white; }
    .btn-red    { background: #dc2626; color: white; font-size: 0.88rem; padding: 9px 13px; min-height: 38px; border-radius: 8px; }

    /* ── Item cards ─────────────────────────── */
    #item-list { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: white;
      border-radius: 12px;
      padding: 14px 14px 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.07);
      border-left: 5px solid #cbd5e1;
      transition: border-color 0.2s;
    }
    .item-card.claimed { border-left-color: #16a34a; }

    .item-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 9px;
      word-break: break-word;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .chip-green { background: #dcfce7; color: #15803d; }
    .chip-gray  { background: #f1f5f9; color: #64748b; }

    /* ── Error / toast ──────────────────────── */
    .error-box {
      background: #fef2f2;
      color: #b91c1c;
      border: 1.5px solid #fca5a5;
      border-radius: 9px;
      padding: 10px 13px;
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }
    .error-box.show { display: block; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Empty / loading ────────────────────── */
    .empty {
      text-align: center;
      padding: 36px 16px;
      color: #94a3b8;
    }
    .empty .icon { font-size: 2.8rem; margin-bottom: 10px; }
    .empty p { font-size: 0.95rem; }
  </style>
</head>
<body>

<header>
  <h1>🏖️ Vacation Sign-Up</h1>
  <p>Who's bringing what?</p>
</header>

<div class="container">

  <!-- Who are you -->
  <div class="card">
    <div class="card-label">Who are you?</div>
    <div class="select-wrap">
      <select id="my-name">
        <option value="">— Select your name —</option>
        {% for name in names %}
        <option value="{{ name }}">{{ name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Add item -->
  <div class="card">
    <div class="card-label">Add something to bring</div>
    <div class="input-row">
      <input type="text" id="new-item" placeholder="e.g. Sunscreen, Cooler…" maxlength="80" autocomplete="off">
      <button class="btn-blue" id="add-btn" onclick="addItem()">Add</button>
    </div>
    <div class="error-box" id="add-error"></div>
  </div>

  <!-- List -->
  <div id="item-list">
    <div class="empty"><div class="icon">⏳</div><p>Loading…</p></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const NAMES = {{ names | tojson }};
  let items = [];

  // ── Helpers ───────────────────────────────────────────
  function esc(s) {
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  function showError(divId, msg) {
    const el = document.getElementById(divId);
    el.textContent = msg;
    el.classList.add("show");
  }

  function clearError(divId) {
    const el = document.getElementById(divId);
    el.textContent = "";
    el.classList.remove("show");
  }

  // ── Render ────────────────────────────────────────────
  function render(data) {
    items = data;
    const list = document.getElementById("item-list");

    if (!data.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="icon">📋</div>
          <p>No items yet — add the first thing to bring!</p>
        </div>`;
      return;
    }

    list.innerHTML = data.map(item => {
      if (item.signed_up_by) {
        return `
          <div class="item-card claimed" id="ic-${item.id}">
            <div class="item-name">${esc(item.name)}</div>
            <div class="item-row">
              <span class="chip chip-green">✓ ${esc(item.signed_up_by)}</span>
              <button class="btn-red" onclick="clearSignup(${item.id})">Clear</button>
            </div>
          </div>`;
      }
      return `
        <div class="item-card" id="ic-${item.id}">
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-row">
            <span class="chip chip-gray">Available</span>
            <button class="btn-green" onclick="signUp(${item.id})">Sign Up</button>
          </div>
        </div>`;
    }).join("");
  }

  // ── API calls ─────────────────────────────────────────
  async function loadItems() {
    try {
      const r = await fetch("/api/items");
      render(await r.json());
    } catch { /* network hiccup — keep current view */ }
  }

  async function addItem() {
    const input = document.getElementById("new-item");
    const name  = input.value.trim();
    clearError("add-error");

    if (!name) { showError("add-error", "Please enter an item name."); return; }

    const btn = document.getElementById("add-btn");
    btn.disabled = true;

    try {
      const r = await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const data = await r.json();
      if (!r.ok) { showError("add-error", data.error); return; }
      input.value = "";
      showToast(`"${data.name}" added!`);
      loadItems();
    } catch {
      showError("add-error", "Network error — please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  async function signUp(itemId) {
    const myName = document.getElementById("my-name").value;
    if (!myName) {
      showToast("Select your name at the top first!");
      document.getElementById("my-name").focus();
      return;
    }

    try {
      const r = await fetch(`/api/items/${itemId}/signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ person: myName }),
      });
      const data = await r.json();
      if (!r.ok) { showToast(data.error); return; }
      showToast("Signed up!");
      loadItems();
    } catch {
      showToast("Network error — please try again.");
    }
  }

  async function clearSignup(itemId) {
    try {
      const r = await fetch(`/api/items/${itemId}/signup`, { method: "DELETE" });
      if (r.ok) { showToast("Cleared."); loadItems(); }
    } catch {
      showToast("Network error — please try again.");
    }
  }

  // ── Init ──────────────────────────────────────────────
  document.getElementById("new-item").addEventListener("keydown", e => {
    if (e.key === "Enter") addItem();
  });

  loadItems();
  setInterval(loadItems, 20000); // auto-refresh every 20s
</script>
</body>
</html>
